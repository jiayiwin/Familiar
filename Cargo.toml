[workspace]
resolver = "3"
members = ["crates/emit", "crates/petd", "app/src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# The emitter runs on every hook call; keep it tiny and fast even in dev builds.
[profile.dev.package.familiar-emit]
opt-level = 2
