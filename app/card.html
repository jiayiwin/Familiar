<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-en="Familiar sessions">Familiar 会话</title>
    <style>
      :root {
        --bg: rgba(250, 248, 244, 0.96);
        --ink: #161514;
        --muted: #8c857b;
        --line: #e2ddd4;
        --red: #a8382b;
        --accent: #a88454;
        --serif: "Palatino Linotype", "Book Antiqua", Georgia, "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: rgba(26, 25, 24, 0.96); --ink: #ece8e1; --muted: #8f887e; --line: #2b2926; --red: #c9574a; --accent: #c8a675; }
      }
      html, body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        font: 12px/1.5 "Segoe UI", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
        color: var(--ink);
        user-select: none;
        -webkit-font-smoothing: antialiased;
      }
      #card {
        margin: 6px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 6px;
        box-shadow: 0 8px 24px rgba(22, 21, 20, 0.12);
        padding: 10px 12px;
        backdrop-filter: blur(10px);
      }
      h1 { font-family: var(--serif); font-size: 13px; font-weight: 400; letter-spacing: 0.04em; margin: 0 0 6px; display: flex; justify-content: space-between; gap: 8px; }
      h1 small { color: var(--muted); font-family: "Segoe UI", sans-serif; font-size: 10.5px; letter-spacing: 0.06em; }
      .row { display: grid; grid-template-columns: 8px 1fr auto; gap: 1px 10px; padding: 6px 0; border-top: 1px solid var(--line); align-items: baseline; }
      .row:first-of-type { border-top: 0; }
      .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); align-self: center; }
      .dot.attention { background: var(--red); box-shadow: 0 0 0 3px color-mix(in srgb, var(--red) 18%, transparent); }
      .dot.tool, .dot.reading, .dot.thinking { background: #4f7f6f; }
      .dot.done { background: var(--accent); }
      .dot.error, .dot.stone, .dot.aborted { background: #8a5a3c; }
      .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .state { color: var(--muted); white-space: nowrap; font-size: 11px; letter-spacing: 0.04em; }
      .state.attention { color: var(--red); }
      .meta { grid-column: 2 / 4; color: var(--muted); font-size: 10.5px; }
      .empty { color: var(--muted); padding: 4px 0; }
      .hint { color: var(--muted); font-size: 10.5px; margin-top: 6px; border-top: 1px solid var(--line); padding-top: 6px; letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <div id="card"></div>
    <script type="module" src="/src/card.ts"></script>
  </body>
</html>
