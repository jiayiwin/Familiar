<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-en="Familiar sessions">Familiar 会话</title>
    <style>
      :root {
        --bg: #fffaf3;
        --ink: #2b1d16;
        --muted: #7a6a5f;
        --line: #eadfd2;
        --red: #e63946;
        --frame: #4a2c20;
      }
      html, body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        font: 12px/1.45 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
        color: var(--ink);
        user-select: none;
      }
      #card {
        margin: 4px;
        background: var(--bg);
        border: 2px solid var(--frame);
        border-radius: 10px;
        box-shadow: 0 3px 0 rgba(74, 44, 32, 0.25);
        padding: 8px 10px;
      }
      h1 { font-size: 12px; margin: 0 0 6px; display: flex; justify-content: space-between; gap: 8px; }
      h1 small { color: var(--muted); font-weight: normal; }
      .row { display: grid; grid-template-columns: 10px 1fr auto; gap: 2px 8px; padding: 5px 0; border-top: 1px solid var(--line); align-items: baseline; }
      .row:first-of-type { border-top: 0; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #9aa0a6; align-self: center; }
      .dot.attention { background: var(--red); box-shadow: 0 0 0 3px rgba(230, 57, 70, 0.2); }
      .dot.tool, .dot.reading, .dot.thinking { background: #2a9d8f; }
      .dot.done { background: #e9c46a; }
      .dot.error, .dot.stone, .dot.aborted { background: #b5651d; }
      .name { font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .state { color: var(--muted); white-space: nowrap; }
      .state.attention { color: var(--red); font-weight: bold; }
      .meta { grid-column: 2 / 4; color: var(--muted); font-size: 11px; }
      .empty { color: var(--muted); padding: 4px 0; }
      .hint { color: var(--muted); font-size: 11px; margin-top: 4px; border-top: 1px dashed var(--line); padding-top: 4px; }
    </style>
  </head>
  <body>
    <div id="card"></div>
    <script type="module" src="/src/card.ts"></script>
  </body>
</html>
