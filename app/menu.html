<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Familiar</title>
    <style>
      :root {
        --accent: #a88454;
        --accent-soft: rgba(168, 132, 84, 0.12);
        --ink: #161514;
        --muted: #8c857b;
        --card: rgba(250, 248, 244, 0.94);
        --disc: rgba(250, 248, 244, 0.96);
        --line: rgba(22, 21, 20, 0.1);
        --shadow: 0 1px 2px rgba(22, 21, 20, 0.06), 0 10px 30px rgba(22, 21, 20, 0.14);
        --emoji: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
        --ui: "Segoe UI", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
        --serif: "Palatino Linotype", "Book Antiqua", Georgia, "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
        --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      @media (prefers-color-scheme: dark) {
        :root { --ink: #ece8e1; --muted: #8f887e; --card: rgba(26, 25, 24, 0.94); --disc: rgba(33, 31, 29, 0.96); --line: rgba(236, 232, 225, 0.1);
          --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px rgba(0,0,0,0.4); }
      }
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; font-family: var(--ui); -webkit-font-smoothing: antialiased; }
      #stage { position: fixed; inset: 0; }

      /* A single hairline circle around the pet. */
      .halo { position: absolute; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%) scale(0.85); opacity: 0;
        transition: transform 420ms var(--ease), opacity 320ms var(--ease); }
      .halo.disc { background: radial-gradient(circle, rgba(250,248,244,0) 45%, color-mix(in srgb, var(--accent) 7%, transparent) 64%, rgba(250,248,244,0) 72%); }
      .halo.ring { border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
      .open .halo { transform: translate(-50%, -50%) scale(1); opacity: 1; }

      .title { position: absolute; transform: translate(-50%, -100%); padding: 5px 14px; border-radius: 2px; background: var(--card);
        color: var(--ink); font-family: var(--serif); font-size: 12.5px; letter-spacing: 0.06em; white-space: nowrap; box-shadow: var(--shadow), 0 0 0 1px var(--line);
        display: flex; align-items: center; gap: 8px; opacity: 0; transition: opacity 300ms 120ms var(--ease); pointer-events: none; backdrop-filter: blur(8px); }
      .title i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
      .open .title { opacity: 1; }

      /* Ring buttons glide out from the pet. Icons stay quiet until hovered. */
      .btn { position: absolute; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; border: none; padding: 0; cursor: pointer;
        background: var(--disc); color: var(--ink); backdrop-filter: blur(8px);
        box-shadow: 0 0 0 1px var(--line), var(--shadow);
        transform: translate(var(--fx), var(--fy)) scale(0.5); opacity: 0;
        transition: transform 420ms var(--ease) var(--d), opacity 260ms var(--ease) var(--d), box-shadow 200ms var(--ease); }
      .open .btn { transform: translate(0, 0) scale(1); opacity: 1; }
      .btn .ic { font-family: var(--emoji); font-size: 20px; line-height: 50px; display: block; filter: grayscale(1) contrast(1.05); opacity: 0.78; transition: filter 200ms, opacity 200ms, transform 200ms var(--ease); }
      .btn .lb { position: absolute; left: 50%; top: 56px; transform: translateX(-50%); padding: 1px 8px; border-radius: 2px; font-size: 10.5px; letter-spacing: 0.08em;
        color: var(--ink); background: var(--card); white-space: nowrap; box-shadow: 0 0 0 1px var(--line); backdrop-filter: blur(8px); }
      .btn:hover, .btn.active { box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
      .btn:hover .ic, .btn.active .ic { filter: none; opacity: 1; transform: scale(1.06); }
      .btn.active .lb { background: var(--ink); color: var(--disc); box-shadow: none; }
      .btn .more { position: absolute; right: 3px; top: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); font-size: 0; }

      /* The card for a group. */
      .card { position: absolute; width: 236px; max-height: 360px; overflow: auto; background: var(--card); border-radius: 6px; padding: 6px;
        box-shadow: 0 0 0 1px var(--line), var(--shadow); transform-origin: var(--ox) var(--oy); backdrop-filter: blur(12px);
        animation: pop 260ms var(--ease); scrollbar-width: thin; }
      @keyframes pop { from { transform: scale(0.94); opacity: 0; } }
      .card .head { display: flex; align-items: center; gap: 8px; padding: 8px 10px 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px;
        font-family: var(--serif); font-size: 14px; letter-spacing: 0.04em; color: var(--ink); }
      .card .head .ic { font-family: var(--emoji); font-size: 14px; filter: grayscale(1); opacity: 0.7; }
      .card .head .back { border: none; background: transparent; color: var(--muted); border-radius: 2px; width: 22px; height: 22px; cursor: pointer; font-size: 14px; }
      .card .head .back:hover { color: var(--ink); background: var(--accent-soft); }
      .row { display: flex; align-items: center; gap: 10px; width: 100%; border: none; background: none; text-align: left; padding: 7px 10px; border-radius: 3px;
        font: inherit; font-size: 12.5px; color: var(--ink); cursor: pointer; animation: rise 260ms var(--ease) both; animation-delay: var(--d); transition: background 150ms; }
      @keyframes rise { from { transform: translateY(3px); opacity: 0; } }
      .row:hover:not(:disabled) { background: var(--accent-soft); }
      .row:disabled { cursor: default; color: var(--muted); font-size: 11.5px; }
      .row:disabled .tx { white-space: normal; line-height: 1.45; }
      .row .ic { font-family: var(--emoji); width: 18px; text-align: center; font-size: 13px; filter: grayscale(1); opacity: 0.75; }
      .row:hover .ic { filter: none; opacity: 1; }
      .row .tx { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .row .hint { color: var(--muted); font-size: 10.5px; }
      .row .ok { color: var(--accent); }
      .row .chev { color: var(--muted); }
      .row.checked .tx { color: var(--ink); text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 4px; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module" src="/src/menu.ts"></script>
  </body>
</html>
