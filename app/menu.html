<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Familiar</title>
    <style>
      :root {
        --accent: #d97757;
        --accent-soft: rgba(217, 119, 87, 0.16);
        --ink: #2b1d16;
        --muted: #8a776a;
        --card: rgba(255, 252, 248, 0.97);
        --line: rgba(74, 44, 32, 0.1);
        --emoji: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
        --ui: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      }
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; font-family: var(--ui); }
      #stage { position: fixed; inset: 0; }

      /* Halo around the pet: a soft disc and a slowly turning dashed ring. */
      .halo { position: absolute; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%) scale(0.6); opacity: 0;
        transition: transform 260ms cubic-bezier(.2,1.4,.4,1), opacity 200ms; }
      .halo.disc { background: radial-gradient(circle, rgba(255,255,255,0.0) 38%, var(--accent-soft) 62%, rgba(255,255,255,0) 72%); }
      .halo.ring { border: 1.5px dashed color-mix(in srgb, var(--accent) 45%, transparent); animation: spin 24s linear infinite; }
      .open .halo { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      @keyframes spin { to { rotate: 360deg; } }

      .title { position: absolute; transform: translate(-50%, -100%); padding: 5px 12px 5px 10px; border-radius: 999px; background: var(--card);
        color: var(--ink); font-size: 12px; font-weight: 700; white-space: nowrap; box-shadow: 0 4px 14px rgba(60,30,10,0.18);
        display: flex; align-items: center; gap: 6px; opacity: 0; transition: opacity 200ms 120ms; pointer-events: none; }
      .title i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
      .open .title { opacity: 1; }

      /* Ring buttons fly out from the pet. */
      .btn { position: absolute; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; border: none; padding: 0; cursor: pointer;
        background: radial-gradient(circle at 35% 28%, #fff, #fbf3ea 70%); color: var(--ink);
        box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 70%, white), 0 6px 16px rgba(60,30,10,0.22);
        transform: translate(var(--fx), var(--fy)) scale(0.2); opacity: 0;
        transition: transform 360ms cubic-bezier(.2,1.5,.35,1) var(--d), opacity 160ms var(--d), box-shadow 150ms; }
      .open .btn { transform: translate(0, 0) scale(1); opacity: 1; }
      .btn .ic { font-family: var(--emoji); font-size: 23px; line-height: 52px; display: block; transition: transform 150ms; }
      .btn .lb { position: absolute; left: 50%; top: 56px; transform: translateX(-50%); padding: 1px 7px; border-radius: 8px; font-size: 11px; font-weight: 700;
        color: var(--ink); background: rgba(255,255,255,0.92); white-space: nowrap; box-shadow: 0 2px 6px rgba(60,30,10,0.14); }
      .btn:hover, .btn.active { box-shadow: 0 0 0 3px var(--accent), 0 0 0 9px var(--accent-soft), 0 8px 20px rgba(60,30,10,0.28); }
      .btn:hover .ic, .btn.active .ic { transform: scale(1.15) rotate(-6deg); }
      .btn.active .lb { background: var(--accent); color: #fff; }
      .btn .more { position: absolute; right: -1px; top: -1px; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); color: #fff;
        font-size: 10px; line-height: 14px; font-weight: 700; }

      /* The card for a group. */
      .card { position: absolute; width: 228px; max-height: 360px; overflow: auto; background: var(--card); border-radius: 16px; padding: 6px;
        box-shadow: 0 0 0 1px var(--line), 0 14px 34px rgba(60,30,10,0.28); transform-origin: var(--ox) var(--oy);
        animation: pop 220ms cubic-bezier(.2,1.3,.4,1); scrollbar-width: thin; }
      @keyframes pop { from { transform: scale(0.6); opacity: 0; } }
      .card .head { display: flex; align-items: center; gap: 6px; padding: 6px 8px 8px; border-bottom: 1px solid var(--line); margin-bottom: 4px;
        font-size: 13px; font-weight: 800; color: var(--ink); }
      .card .head .ic { font-family: var(--emoji); font-size: 16px; }
      .card .head .back { border: none; background: var(--accent-soft); color: var(--accent); border-radius: 8px; width: 24px; height: 24px; cursor: pointer;
        font-size: 14px; font-weight: 800; }
      .row { display: flex; align-items: center; gap: 8px; width: 100%; border: none; background: none; text-align: left; padding: 7px 8px; border-radius: 10px;
        font: inherit; font-size: 13px; color: var(--ink); cursor: pointer; animation: rise 220ms both; animation-delay: var(--d); }
      @keyframes rise { from { transform: translateY(6px); opacity: 0; } }
      .row:hover:not(:disabled) { background: var(--accent-soft); }
      .row:disabled { cursor: default; color: var(--muted); font-size: 12px; }
      .row:disabled .tx { white-space: normal; line-height: 1.35; }
      .row .ic { font-family: var(--emoji); width: 20px; text-align: center; font-size: 15px; }
      .row .tx { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .row .hint { color: var(--muted); font-size: 11px; }
      .row .ok { color: var(--accent); font-weight: 900; }
      .row .chev { color: var(--muted); font-weight: 800; }
      .row.checked .tx { font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module" src="/src/menu.ts"></script>
  </body>
</html>
