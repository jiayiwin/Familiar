<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Rill</title>
    <style>
      /* Colours come from the pet's skin (src/skin.ts); these are 紫梦's, until the skin is on. */
      :root { --accent: #7a5fc0; --accent-deep: #6a50b0; --accent-soft: #ece4ff; --accent-text: #5b4696; --accent-off: #cfc3e6; --hover: #f5eefc; --room: #f3ecf9; --room-night: #ebe3f4; --room-line: #e3d8ea; --cushion: #e0d4ff; --stage: #e9eff8; --stage-ink: #5d6c85; --stage-line: #cfd9e8; --shade: 110, 88, 140; --motif-fill: #f3e9cf; --motif-line: #cdbdba; }
      html:not([data-skin]) body { visibility: hidden; }
      /* The pet's own paper: the same card in light and dark Windows themes,
         like the speech bubble above it. */
      :root {
        --paper: #fffaf2;
        --ink: #5b4a57;
        --muted: #776775;
        --line: #d9cbc8;
        --rule: #efe6e2;
        --alert: #c24e38;
        --shadow: 0 14px 34px rgba(var(--shade), 0.26);
        --ui: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
        --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; font-family: var(--ui); color: var(--ink); -webkit-font-smoothing: antialiased; }
      #stage { position: fixed; inset: 0; }
      button { font: inherit; color: inherit; }

      .card { position: absolute; box-sizing: border-box; background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow);
        display: flex; flex-direction: column; gap: 2px; opacity: 0; transform: translateY(6px) scale(0.97);
        transition: opacity 140ms var(--ease), transform 200ms var(--ease); }
      .card.in { opacity: 1; transform: none; }
      .main { width: 250px; padding: 10px; border-radius: 22px; transform-origin: var(--ox, 0) 100%; }
      .sub { min-width: 128px; max-width: 280px; max-height: min(560px, calc(100vh - 16px)); overflow-y: auto; padding: 8px; border-radius: 20px;
        scrollbar-width: thin; scrollbar-color: var(--line) transparent; }

      .who { display: flex; flex-direction: column; gap: 2px; padding: 8px 12px 10px; }
      .who .nm { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800; }
      .who .camp { display: flex; align-items: center; gap: 5px; margin-left: auto; font-size: 12px; font-weight: 600; color: var(--muted); }
      .who .camp i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
      .who .sb { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      .row { display: flex; align-items: center; gap: 11px; width: 100%; box-sizing: border-box; min-height: 44px; padding: 0 12px; border: 0; border-radius: 14px;
        background: transparent; text-align: left; font-size: 14px; font-weight: 700; cursor: pointer; transition: background 120ms; flex: none; }
      .sub .row { min-height: 40px; border-radius: 12px; gap: 10px; }
      .row:hover:not(:disabled), .row:focus-visible { background: var(--hover); outline: none; }
      .row.open, .row.open:hover { background: var(--accent-soft); }
      .row svg { flex: none; stroke: var(--muted); }
      .row.open svg { stroke: var(--accent); }
      .row .tx { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .row .hint { flex: none; max-width: 55%; font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .row .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--alert); }
      .row .ok { flex: none; stroke: var(--accent); }
      .row.checked .tx { color: var(--accent-text); }
      /* A line of information, not a choice. */
      .row:disabled { cursor: default; min-height: 0; padding: 7px 12px; font-size: 12px; font-weight: 500; line-height: 1.5; color: var(--muted); }
      .row:disabled .tx { white-space: normal; }

      .head { display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 6px 0 12px; font-size: 12px; font-weight: 700; color: var(--muted); flex: none; }
      .head .back { display: grid; place-items: center; width: 28px; height: 28px; margin-left: -8px; border: 0; border-radius: 50%; background: transparent; cursor: pointer; }
      .head .back:hover { background: var(--hover); }
      .head .back svg { stroke: var(--muted); }

      @media (prefers-reduced-motion: reduce) { .card { transition: none; transform: none; } }
      /* 记一件事: the pet's own bubble, with a line to write in, over its head. */
      .note { width: 290px; padding: 9px 10px 7px; border-radius: 16px; transform-origin: 50% 100%; }
      .note::after { content: ""; position: absolute; left: var(--tail, 50%); bottom: -7px; width: 12px; height: 12px; margin-left: -6px; background: var(--paper);
        border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: rotate(45deg); }
      .note input { box-sizing: border-box; width: 100%; height: 30px; padding: 0 10px; border: 1.5px solid var(--accent-off); border-radius: 10px; background: #fff;
        font: 600 13px var(--ui); color: var(--ink); outline: none; user-select: text; }
      .note input:focus { border-color: var(--accent); }
      .note input::placeholder { color: #a597a2; font-weight: 500; }
      .note .nh { margin-top: 5px; font-size: 11px; color: var(--muted); text-align: center; }
      .note .nh.bad { color: var(--alert); }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module" src="/src/menu.ts"></script>
  </body>
</html>
