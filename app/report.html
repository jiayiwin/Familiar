<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-en="Daily report">今日报告</title>
    <link rel="stylesheet" href="/src/ui.css" />
    <style>
      html, body { overflow: hidden; }
      body { display: flex; flex-direction: column; align-items: center; padding: 12px 14px 10px; gap: 8px; perspective: 900px; }
      canvas { border-radius: 24px; box-shadow: 0 2px 4px rgba(31,34,69,0.08), 0 22px 48px rgba(31,34,69,0.22); cursor: pointer; max-width: 100%;
        transition: transform 0.18s var(--ease), box-shadow 0.18s var(--ease); will-change: transform; }
      canvas:hover { box-shadow: 0 6px 10px rgba(31,34,69,0.1), 0 30px 60px rgba(31,34,69,0.28); }
      .bar { display: flex; gap: 8px; align-items: center; }
      .bar button { padding: 4px 13px; font-size: 12px; }
      .hint { color: var(--muted); font-size: 11px; line-height: 1; }
    </style>
  </head>
  <body>
    <canvas id="card" title="点一下关闭" data-en-title="Click to close"></canvas>
    <div class="bar">
      <button id="prev" class="ghost" data-en="‹ Previous day">‹ 前一天</button>
      <button id="copy" class="primary" data-en="Copy as image">复制为图片</button>
      <button id="next" class="ghost" data-en="Next day ›">后一天 ›</button>
    </div>
    <div class="hint" data-en="Click the card to close">点卡片关闭</div>
    <script type="module" src="/src/report.ts"></script>
  </body>
</html>
