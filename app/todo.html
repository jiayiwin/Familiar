<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>手上的事 · 预览</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #e9ecf2; }
      canvas { display: block; }
      :root { --bg: #fffaf2; --ink: #5b4a57; --muted: #776775; --line: #efe6e2; --red: #c24e38; --accent: #7a5fc0; --accent-deep: #6a50b0; --accent-soft: #ece4ff; --hover: #f5eefc; --shade: 110, 88, 140; }
      /* The hover card, as card.html draws it, with the new 「手上的事」 under the sessions. */
      #card {
        position: absolute; width: 300px; display: none;
        background: var(--bg); border-radius: 18px; border: 1px solid #d9cbc8;
        box-shadow: 0 8px 20px rgba(var(--shade), 0.24); padding: 0 12px 10px; overflow: hidden;
        font: 12px/1.5 "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
        color: var(--ink); -webkit-font-smoothing: antialiased;
      }
      #card.on { display: block; }
      h1 { font-size: 13px; font-weight: 800; margin: 0 -12px 2px; padding: 8px 12px 2px; display: flex; justify-content: space-between; gap: 8px; }
      h1 small { color: var(--muted); font-weight: 400; font-size: 10.5px; }
      h2 { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .04em; margin: 10px 0 2px; display: flex; justify-content: space-between; }
      h2 small { font-weight: 400; letter-spacing: 0; }
      .row { display: grid; grid-template-columns: 10px 1fr auto; gap: 1px 10px; padding: 6px 0; border-top: 1px solid var(--line); align-items: baseline; }
      .row:first-of-type { border-top: 0; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); align-self: center; }
      .dot.tool { background: #2f9a8a; }
      .dot.done { background: #d2a13c; }
      .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .state { color: var(--muted); font-size: 11px; white-space: nowrap; }
      .meta { grid-column: 2 / 4; color: var(--muted); font-size: 10.5px; }
      /* A thing in hand: a round tick, the words, where it came from. */
      .todo { display: grid; grid-template-columns: 16px 1fr; gap: 0 9px; padding: 6px 8px; margin: 0 -8px; border-radius: 10px; align-items: start; }
      .todo + .todo { border-top: 1px solid var(--line); border-radius: 0 0 10px 10px; }
      .todo.hover { background: var(--hover); }
      .tick { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid #cbbcc6; margin-top: 2px; box-sizing: border-box; display: grid; place-items: center; }
      .todo.hover .tick { border-color: var(--accent); }
      .todo.gone .tick { background: var(--accent); border-color: var(--accent); }
      .todo.gone .tick::after { content: ""; width: 6px; height: 3px; border: solid #fff; border-width: 0 0 1.6px 1.6px; transform: translateY(-1px) rotate(-45deg); }
      .todo.gone .what { text-decoration: line-through; color: var(--muted); }
      .todo.gone { opacity: .7; }
      .what { font-weight: 600; }
      .from { grid-column: 2; color: var(--muted); font-size: 10.5px; display: flex; gap: 6px; align-items: center; }
      .from .wait { color: var(--accent-deep); font-weight: 700; }
      .from i { width: 6px; height: 6px; border-radius: 50%; background: #2f9a8a; display: inline-block; }
      .add { margin-top: 6px; padding: 6px 9px; border: 1px dashed #dccfd6; border-radius: 10px; color: #a597a2; font-size: 11.5px; }
      .add.typing { border-style: solid; border-color: var(--accent); color: var(--ink); background: #fff; }
      .add.typing::after { content: ""; display: inline-block; width: 1px; height: 13px; background: var(--ink); margin-left: 1px; vertical-align: -2px; animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .hint { color: var(--muted); font-size: 10.5px; margin-top: 8px; }
      #cap { position: absolute; left: 24px; top: 20px; font: 600 15px "Microsoft YaHei UI", sans-serif; color: #4a3f55; background: rgba(255,250,242,.86); padding: 8px 14px; border-radius: 12px; box-shadow: 0 2px 10px rgba(110,88,140,.18); }
      #cap small { display: block; font-weight: 400; font-size: 12px; color: #776775; margin-top: 2px; }
    </style>
  </head>
  <body>
    <!-- A pretend desktop, for seeing 「手上的事」 before it is built. Not part of the app. -->
    <canvas id="desk"></canvas>
    <div id="card"></div>
    <div id="cap"></div>
    <script type="module" src="/src/todo-preview.ts"></script>
  </body>
</html>
