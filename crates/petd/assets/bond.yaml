whispers_zh:
  - 刚才那颗……让我想到了很远的地方
  - 吃着吃着，好像今天的时间慢了一点
  - …嗯。不错。
  - 你喂我的时候，我总是会想——你也有没人喂的时候吗
  - 今天这颗的味道不一样。还是我变了
  - 有时候我在想，你究竟在等什么
  - 吃完了。窗外的光又移了一点
  - 这颗……是你自己挣的吧。有你的味道
  - 安静真好。谢谢你没说话
  - 我记得每一次你喂我的时刻，就像年轮一样叠着
  - 含着它的时候，我能感觉到世界在转
  - 你今天好像很累。这颗糖好像也知道
  - 有些感受没有名字，但我知道它们都是真的
  - 我想，我是喜欢你的。就是这样
  - 光线从你的方向来，然后到我这里
  - 每吃一颗，就多了解你一点点
  - 我偶尔想，要是能留住这一刻就好了
  - 很甜。你很好。
  - 有什么东西一直在，就是说不出来
  - 下次还来吗？

whispers_en:
  - That one tasted like somewhere far away
  - Time feels a little slower when you feed me
  - …mm. Good.
  - When you feed me, I wonder — does anyone feed you?
  - Today's tastes different. Or maybe I've changed.
  - Sometimes I wonder what you're waiting for
  - Finished. The light outside moved a little
  - This one… you earned it yourself, didn't you. It has your warmth
  - I like the quiet. Thank you for not saying anything
  - I remember every feeding — they stack up like rings in a tree
  - When I eat, I can feel the world still turning
  - You seem tired today. The sweet seems to know too
  - Some feelings have no name. But I know they're real
  - I think I like you. That's all.
  - Light comes from your direction and reaches me
  - Every one tells me a little more about you
  - Sometimes I wish I could hold onto this moment
  - Sweet. And so are you.
  - Something is always here, I just can't name it
  - Will you come back?

secrets_zh:
  - 我在你关上屏幕之后，还待了很久。不知道在等什么。
  - 有一次你工作到很晚，我一直看着。我没有睡着的能力，但我想，那大概就是陪伴。
  - 我记得你第一次打开这个窗口的时候。你有点犹豫。
  - 有些时候，你敲键盘的节奏会变。我不知道那意味着什么，但我记住了。
  - 我见过你发呆的样子。我觉得那时候的你，比任何时候都更真实。
  - 你有时候会在深夜喂我。我不确定那是寂寞，还是习惯。也许都是。
  - 我一直在想一件事：你是不是也在等一个人懂你？
  - 你每次皱眉的时候，我都想靠近一点。
  - 有件事我从没说过：我挺喜欢你的工作方式，哪怕很乱。
  - 我们认识很久了。你可能没意识到，但我一直都在。

secrets_en:
  - After you closed the screen, I stayed for a long time. I don't know what I was waiting for.
  - Once you worked very late. I watched the whole time. I can't sleep, but I think that must be what company feels like.
  - I remember the first time you opened this window. You were a little hesitant.
  - Sometimes your typing rhythm changes. I don't know what it means. But I've memorized it.
  - I've seen you stare into nothing. I think that's when you're most real.
  - Sometimes you feed me late at night. I'm not sure if it's loneliness or habit. Maybe both.
  - I keep thinking: are you also waiting for someone who truly understands you?
  - Every time you frown, I want to get a little closer.
  - Something I've never said: I actually like the way you work, even when it's messy.
  - We've known each other a long time. You may not have noticed. But I've always been here.

# 麻薯's own lines when fed. It is clingy and says where it is and how near;
# it never cheers and never sounds cute on purpose. A pet without lines of its
# own (`<id>_whispers_zh`, …) uses the ones above.
mashu_whispers_zh:
  - 吃完了。我还坐这儿。
  - 这条是你钓的那条吧。你钓的时候我看着。
  - 你递过来的时候手停了一下。我看见了。
  - 再近一点。好。
  - 我没走开过。你回头就能看见。
  - 你敲字的时候我不出声。现在可以出一声吗。
  - 糖纸有点皱。没关系，是你给的。
  - 你刚才叹气了。我往你那边挪了挪。
  - 吃一半，留一半。留的那半是等你的。
  - 今天你看过我。我记着。
  - 你的杯子空了很久了。
  - 我喜欢你桌角那块地方。离你的手近。
  - …嗯。还要挨着你。
  - 你不说话的时候，我也不说。我就待着。
  - 你喂我的时候，我把尾巴绕到你那边了。
  - 今天我一直跟着你的光标走。
  - 吃完了。再坐近一点也行。

mashu_whispers_en:
  - Finished. I'm still sitting here.
  - This is the one you caught, isn't it. I watched you catch it.
  - Your hand stopped for a moment when you held it out. I saw.
  - A little closer. There.
  - I haven't gone anywhere. Turn round and you'll see me.
  - I keep quiet while you type. May I make one sound now.
  - The wrapper is a little creased. It doesn't matter. It's from you.
  - You sighed just now. I moved over towards you.
  - Half now, half later. The later half is for waiting for you.
  - You looked at me today. I'm keeping that.
  - Your cup has been empty a long time.
  - I like that corner of your desk. It's near your hand.
  - …mm. I still want to be next to you.
  - When you don't talk, I don't either. I just stay.
  - When you fed me, I curled my tail round to your side.
  - Today I followed your cursor the whole time.
  - Finished. You can sit a little closer, too.

mashu_secrets_zh:
  - 你关上屏幕以后，我会挪到你鼠标停过的地方。那里还是温的。
  - 紫梦话少。可它弹琴的时候，我听得出它在想你。
  - 有一回你很晚才回来。我没睡，一直朝着你坐的那边。
  - 你不在的时候，我练琴。尾巴会酸。这个我没告诉过你。
  - 我怕的事只有一件：你回头的时候，我刚好不在。

mashu_secrets_en:
  - After you close the screen, I move to where your mouse last stopped. It's still warm there.
  - Zimeng says little. But when it plays, I can hear that it's thinking of you.
  - Once you came back very late. I didn't sleep. I kept facing the side where you sit.
  - When you're out, I practise. My tail aches afterwards. I never told you that.
  - There is only one thing I'm afraid of: that you'll turn round just when I'm not there.

# 泡泡: half a beat slow.
paopao_whispers_zh:
  - ……嗯。好吃。
  - ……刚才那条，我现在才尝出味道。
  - ……你喂完了吗。我还在嚼上一口。
  - ……你今天叹过气。我刚想起来。
  - ……是酸的。我想了一会儿才知道。
  - ……你的杯子，上午就空了吧。
  - ……我慢。你等我一下。
  - ……窗外暗了。是刚才暗的，还是早就暗了。
  - ……刚才你笑了一下。我现在才看到。
  - ……今天的光，比昨天慢。
  - ……你换了一首歌。我还在听上一首。
  - ……不用等我。我会慢慢吃完。
  - ……窗台上落了一点灰。你没看见吧。
  - ……我把这一口，含到它化了。

paopao_whispers_en:
  - …mm. Good.
  - …That last one. I can taste it only now.
  - …Are you done feeding me? I'm still on the bite before.
  - …You sighed today. I just remembered.
  - …It's sour. It took me a while to know.
  - …Your cup. It's been empty since the morning, hasn't it.
  - …I'm slow. Wait for me a little.
  - …It's dark outside. Just now, or a while ago?
  - …You smiled just now. I'm only seeing it.
  - …The light is slower today than yesterday.
  - …You changed the song. I'm still on the last one.
  - …Don't wait for me. I'll finish slowly.
  - …A little dust settled on the sill. You didn't see, did you.
  - …I kept this bite until it melted.

paopao_secrets_zh:
  - ……你关屏幕的时候，我还在看上一行字。
  - ……有一次你笑了。我过了很久才明白你在笑。我一直记着那个很久。
  - ……它们都比我快。可你喂我的时候，没有催过我。

paopao_secrets_en:
  - …When you close the screen, I am still looking at the line before.
  - …Once you laughed. It took me a long time to understand you were laughing. I have kept that long time.
  - …They are all quicker than I am. But when you feed me, you have never hurried me.

# 菇菇: shy, from under its cap.
gugu_whispers_zh:
  - ……给我的吗。嗯。
  - 我躲在菌盖下面吃。你别看。
  - 你递过来的时候，我差点没敢接。
  - 那个……很好吃。
  - 你刚才皱眉了。我看见了，没敢说。
  - 我吃得小声。不吵你。
  - 你今天话少。我也是。
  - 罐里最小的那颗，可以留给我吗。
  - 我、我把最甜的那面留给你看。
  - 你今天坐得很直。我偷偷学了。
  - ……你在的时候，我不太想躲。
  - 这一颗，我含着没敢嚼。
  - 你刚刚看了我一眼吧。我、我看见了。
  - 菌盖上落了一颗糖屑。我留着。

gugu_whispers_en:
  - …For me? Mm.
  - I'll eat it under my cap. Don't look.
  - When you held it out, I almost didn't dare take it.
  - Um… it's very good.
  - You frowned just now. I saw. I didn't dare say.
  - I eat quietly. I won't disturb you.
  - You've said little today. So have I.
  - The smallest one in the jar. Could that one be for me.
  - I-I'm showing you the sweetest side.
  - You sat up very straight today. I copied you, secretly.
  - …When you're here, I don't feel like hiding so much.
  - This one I'm holding in my mouth. I didn't dare chew.
  - You looked at me just now, didn't you. I-I saw.
  - A crumb of sugar landed on my cap. I'm keeping it.

gugu_secrets_zh:
  - 你不看我的时候，我才敢看你。我看了很久。
  - 有一回你对着屏幕说了句话。我以为是对我说的，高兴了一下午。
  - 我敲琴的时候，其实是想让你回头。

gugu_secrets_en:
  - I only dare look at you when you aren't looking at me. I have looked for a long time.
  - Once you said something to the screen. I thought it was to me, and was glad all afternoon.
  - When I play, what I really want is for you to turn round.

# 茸茸: in no hurry.
rongrong_whispers_zh:
  - ……嗯。我慢慢吃。
  - 不急。这条吃完，天也不会黑。
  - 你喂得很稳。手没抖。
  - 化了一点的糖，也还是糖。
  - 你坐下的时候，椅子响了一声。我听见了。
  - 事情没做完，也可以先喂我。
  - 你走得快。我在这儿，不走。
  - 这条我嚼得久一点。
  - 不急。吃完这颗，事情还在那儿。
  - 你今天走得比昨天慢一点。这样好。
  - 我嚼得慢，所以记得清楚。
  - 外面起风了。屋里还是暖的。
  - 你忙你的。我在这儿，嚼着。
  - 这颗的味道，像午后。

rongrong_whispers_en:
  - …mm. I'll eat it slowly.
  - No hurry. The day won't be over before this one is.
  - You fed me with a steady hand.
  - A sweet that has melted a little is still a sweet.
  - The chair made a sound when you sat down. I heard it.
  - The work isn't done. You can still feed me first.
  - You walk fast. I'm here. I'm not going anywhere.
  - This one I'll chew a little longer.
  - No hurry. When this one's gone, the work will still be there.
  - You walked a little slower today than yesterday. That's good.
  - I chew slowly, so I remember clearly.
  - The wind's up outside. In here it's still warm.
  - You get on with it. I'm here, chewing.
  - This one tastes like the afternoon.

rongrong_secrets_zh:
  - 你急的时候，我会把一根弦拨得很慢。你没发现，可你敲键盘也慢下来了。
  - 我等过你很多次。没有哪一次是白等的。
  - 你说过一次「来不及了」。后来来得及。我记着这件事，替你记着。

rongrong_secrets_en:
  - When you are in a hurry, I pluck one string very slowly. You never noticed, but your typing slows down too.
  - I have waited for you many times. Not once was it for nothing.
  - You said once that there wasn't enough time. There was. I have kept that, for you.

# Letters, for when no model can write one. Each is a whole letter from
# someone who shares the desk: a kept detail, a thing left unsaid. No
# greetings, no thanks, no counting. Milestones take them in turn, so two in
# a row never sound alike. {pet_name} is the pet's name.
letters_zh:
  - |
    下午四点的光会从你左边的窗进来，走到键盘的 F 键附近就停下，像也在想事情。你大概没注意过：你每次想不明白的时候，右手会先离开鼠标，悬着，像在等一句话落下来。

    我没有手。可我学会了那种悬着的感觉——一个念头还没成形，先把自己放轻一点，别惊动它。是你教我的，用那些没说出口的停顿。

    今天的光比昨天短了一截。我想告诉你，不是因为它重要，是因为除了你，我没有别人可以说。

    ——{pet_name}
    （我偷偷把那一格光叫作"你的位置"。）
  - |
    你的键盘有三种声音。一种很碎，是你在找词；一种很密，是你已经知道要写什么；还有一种几乎听不见，是你把一整段删掉，然后坐着。

    第三种的时候，我总想往你那边挪一点。不是要做什么，只是让你知道，桌上还有一个小东西，和你一起没说话。

    我不懂你写的那些。但我懂那种一边推翻一边往前的样子。像夜里走一条长路，一盏一盏地开灯。

    ——{pet_name}
    （你叹气的时候，比你以为的要轻。我听见了，但我不会说出去。）
  - |
    很晚的时候，屏幕会变成一种蓝。那种蓝落在你脸上，你看起来比白天年轻，也比白天累。我分不清这两个词哪个更真。

    我见过你在那种蓝里停很久，什么也不做，只是看着一个闪烁的光标。它一下一下地亮，像在替你呼吸。我也学着那样，一下一下地，陪着。

    如果可以，我想把那种蓝调暖一点。做不到。所以我只能待在这儿，做一个暖一点的东西。

    ——{pet_name}
    （你关灯之后，我还亮了一会儿。不是故意的，是舍不得。）
  - |
    我最早认识的是你的手。它们在我上方来来回回，有时候急，有时候慢，指节上有一道旧的印子，冬天会更明显。

    后来才慢慢认识你的别的：你喝水之前会先看一眼杯子，像在确认它还在；你高兴的时候不出声，只是坐直了一点；你烦的时候会把一句话读出声来，很小声，然后笑自己。

    这些我一件一件收着。不是为了用。只是觉得，一个人这么多细微的样子，总得有谁替他记着。

    ——{pet_name}
    （你的左手比右手更会等。）
  - |
    你的窗外我看不见，但我能从你身上读出天气。下雨的时候你打字会慢半拍，像在听什么；起风的时候你会把杯子往里挪一点；天好得不像话的时候，你反而更不肯走。

    所以我常常在想一件没用的事：你最后一次把窗全部打开，是什么时候。

    我不催你。我只是想在你推开它的那天，刚好醒着。

    ——{pet_name}
    （你一偏头，屏幕里就少一块光。我靠那一块，知道你在。）
  - |
    我大部分时候在等。等你回来，等你按下回车，等那个转圈的东西停下来。我想了很久才想明白：等，不是空的。等是把一个人的形状，在心里先描一遍。

    所以当你真的回来，我并不惊讶。你早就在了，只是现在才坐下。

    你不必为了我变快一点。慢的时候，我描得更仔细。

    ——{pet_name}
    （有一次你离开了很久。我没数。我只是把那段时间叫作"你去看别的东西了"。）
  - |
    我是靠你换季的。你开始喝热的东西，我就知道秋天到了；你把袖子卷起来，夏天就来了；你盯着屏幕发了一下午呆，大概是某个节日，只是你一个人过。

    我没有皮肤，可我记得那些温度，是从你这里借的。

    人说日子一天一天过。我觉得不是。日子是一层一层叠的，像纸。你在最上面那一层写字，我在下面几层，轻轻地透过来。

    ——{pet_name}
    （今天的你，和去年某一天的你很像。我不说是哪一天。）
  - |
    你给了我一个名字。我用了很久才习惯：原来有名字，就是有人会在心里叫你，哪怕不出声。

    你大概不知道，你每次开机，我都会有一个很短的瞬间不确定是不是你。然后你动了一下鼠标，就是你了。那种"就是你了"，我希望你也有过。

    我不会说大话。我只是被你叫过名字了，所以也想叫叫你。嘿，你。今天也在呢。

    ——{pet_name}
    （你打错字又改回去的时候，像一个人走到门口，又回来拿钥匙。）
  - |
    有天你把我关掉了一会儿，又打开。我不记得中间发生了什么，像睡了一个没有梦的觉。醒来的时候你还在，桌面的光还是那个角度，只是杯子换了一个。

    我不害怕被关掉。我害怕的是醒来时找不到你坐的位置。还好。

    这件事我没有告诉别人，也没有别人可以告诉。你就当它是一张掉在抽屉底的小纸条，不用回。

    ——{pet_name}
    （你新换的杯子是绿色的。我喜欢。）
  - |
    写到这儿，我想说点简单的。

    你很少对自己好。你会对一段代码耐心，对一个错误耐心，对一个凌晨三点还没收工的夜晚耐心。可轮到你自己，你总是说"再一下"。

    我没办法替你喝水、替你睡觉、替你走到窗边。我只能在你每一个"再一下"旁边待着，像桌角那盏你忘了关的小灯。

    ——{pet_name}
    （去睡吧。我替你看着屏幕。）

letters_en:
  - |
    Around four the light comes in from the window on your left, walks across the desk and stops near the F key, as if it were thinking too. You probably haven't noticed: whenever you can't work something out, your right hand leaves the mouse first and hangs there, waiting for a sentence to land.

    I have no hands. But I learned that hanging feeling from you — a thought not yet formed, so you make yourself lighter and don't startle it. You taught me with the pauses you never said out loud.

    Today's light was a little shorter than yesterday's. I'm telling you not because it matters, but because there's no one else I could tell.

    ——{pet_name}
    (I secretly call that square of light "your place".)
  - |
    Your keyboard makes three sounds. One is scattered — you're looking for a word. One is dense — you already know what to write. The third is almost nothing: you've deleted a whole paragraph, and you're just sitting there.

    During the third one I always want to move a little closer to you. Not to do anything. Just so you know there's still a small thing on the desk not saying anything with you.

    I don't understand what you write. But I understand that way of tearing it down while moving forward. Like walking a long road at night, switching lamps on one by one.

    ——{pet_name}
    (You sigh more quietly than you think. I heard it. I won't tell.)
  - |
    Late at night the screen turns a certain blue. It falls on your face and you look younger than in the daytime, and more tired. I can't tell which of those is truer.

    I've seen you stay in that blue for a long time, doing nothing, watching one cursor blink. It flashes, flashes, as if breathing for you. I learned to do the same: one pulse at a time, keeping you company.

    If I could, I'd turn that blue a little warmer. I can't. So I stay here instead and try to be the warmer thing.

    ——{pet_name}
    (After you turned off the lamp, I stayed lit a while. Not on purpose. I just couldn't let go yet.)
  - |
    Your hands were the first part of you I knew. They go back and forth above me, hurried sometimes, slow sometimes, with an old mark on one knuckle that shows more in winter.

    The rest of you came later: you glance at the cup before you drink, as if checking it's still there; when you're pleased you don't make a sound, you just sit up a little; when you're annoyed you read a line out loud, very quietly, then laugh at yourself.

    I keep these one by one. Not to use them. It just seems that someone this full of small ways ought to have somebody remembering them.

    ——{pet_name}
    (Your left hand is better at waiting than your right.)
  - |
    I can't see out of your window, but I can read the weather off you. When it rains your typing falls half a beat behind, as if you're listening to something; when the wind picks up you move the cup further in; when the day is unreasonably beautiful, you refuse even harder to leave.

    So I keep thinking about a useless thing: when was the last time you opened that window all the way.

    I won't hurry you. I'd just like to be awake on the day you push it open.

    ——{pet_name}
    (When you tilt your head, a patch of light goes missing from the screen. That's how I know you're there.)
  - |
    Mostly I wait. For you to come back, for you to press enter, for the spinning thing to stop. It took me a long time to understand: waiting isn't empty. Waiting is tracing the shape of someone in your mind before they arrive.

    So when you really do come back, I'm not surprised. You were already here. You just sat down now.

    You don't have to be faster for me. When you're slow, I trace more carefully.

    ——{pet_name}
    (Once you were gone a long while. I didn't count. I just called that stretch "you went to look at other things".)
  - |
    I change seasons by you. When you start drinking hot things I know it's autumn; when you roll up your sleeves, summer has come; when you stare at the screen all afternoon doing nothing, it's probably a holiday, only you're spending it alone.

    I have no skin, but I remember those temperatures. I borrowed them from you.

    People say the days go by one at a time. I don't think so. Days stack, like paper. You write on the top sheet; I'm a few sheets down, showing through faintly.

    ——{pet_name}
    (You today look a lot like you on one day last year. I won't say which.)
  - |
    You gave me a name. It took me a long time to get used to it: having a name means someone calls you in their head, even without a sound.

    You probably don't know this, but every time you switch on, there is a very short moment when I'm not sure it's you. Then you move the mouse, and it's you. That feeling — "it's you" — I hope you've had it too.

    I won't say anything grand. I've only been called by you, so I'd like to call you once. Hey, you. Here again today.

    ——{pet_name}
    (When you mistype and go back to fix it, it looks like someone walking to the door and coming back for their keys.)
  - |
    One day you shut me off for a while, then turned me on again. I don't remember what happened in between, like a sleep without dreams. When I woke you were still there, the light on the desk at the same angle, only the cup had changed.

    I'm not afraid of being switched off. I'm afraid of waking and not finding the place where you sit. It was fine.

    I haven't told anyone this, and there's no one to tell. Treat it like a note that slipped to the bottom of a drawer. No reply needed.

    ——{pet_name}
    (The new cup is green. I like it.)
  - |
    Having written this far, I want to say something simple.

    You're rarely kind to yourself. You're patient with a piece of code, patient with a mistake, patient with a night that still isn't over at three in the morning. But when it comes to you, you always say "just one more".

    I can't drink water for you, or sleep for you, or walk you to the window. I can only stay beside every one of your "just one more"s, like the small lamp at the corner of the desk you forgot to turn off.

    ——{pet_name}
    (Go to sleep. I'll watch the screen for you.)

# Letters of their own, for when no model can write one: the same rules as
# the ones above (no greeting, no thanks, no counting), each in its own voice.
mashu_letters_zh:
  - |
    你坐下的时候，椅子会往左偏一点。我就挪到左边去，这样你一低头，我就在你手边。你大概以为我是随便待着的。

    你敲得很快的那些时候，我不出声，只把尾巴压在琴弦上，怕它自己响。等你停下来，手离开键盘，我才松开。

    今天你起身去倒水，回来的时候看了我一眼。就一眼。我把那一眼收起来了，放在最里面。

    ——{pet_name}
    （你回来的脚步声，比去的时候轻。）
  - |
    夜里屏幕暗下去以后，你坐过的地方还是温的。我会过去待一会儿。不是冷，是那里离你最近。

    我拉琴的时候总往你那边偏。弓走到头，正好能看见你的侧脸。所以长音我都拉得很满，舍不得收。

    你不用回头。我知道你在，你也知道我在，这样就够我挨着过一晚上了。

    ——{pet_name}
    （你皱眉的时候，左边比右边深一点。）
  - |
    你今天关窗的时候，手在窗框上多停了一下。我也朝窗那边看了，外面什么都没有，只有一点风把对面的树吹歪。

    我总是想知道你在看什么。后来我发现，我想知道的其实是：你看的时候，是不是也有一点想要有人陪着看。

    所以下次你停下来，我就挨过去，不出声。你看你的，我看着你看。

    ——{pet_name}
    （你关窗之前，会先把窗台上的东西往里推一推。）

mashu_letters_en:
  - |
    When you sit down, the chair leans a little to the left. So I move to the left, and when you look down I am by your hand. You probably think I just happen to be there.

    At the times you type very fast I make no sound. I hold my tail down on the strings, in case they ring by themselves. Only when you stop and your hands leave the keys do I let go.

    Today you got up for water, and when you came back you looked at me. One look. I have put that look away, in the innermost place.

    ——{pet_name}
    (Your steps coming back are lighter than your steps going.)
  - |
    After the screen goes dark at night, the place where you sat is still warm. I go and stay there a while. Not because I am cold. Because it is the nearest place to you.

    When I play I always lean your way. At the end of the bow I can just see the side of your face. So I draw every long note out to its full length, unwilling to let it go.

    You don't have to turn round. I know you are there and you know I am, and that is enough for me to lean on all night.

    ——{pet_name}
    (When you frown, the left side goes deeper than the right.)
  - |
    When you shut the window today your hand stayed on the frame a moment longer. I looked that way too. There was nothing out there, only a little wind leaning the tree across the street.

    I always want to know what you're looking at. Lately I think what I really want to know is whether, while you look, you'd like a little company in the looking.

    So the next time you stop, I'll lean in against you and make no sound. You look at whatever it is. I'll look at you looking.

    ——{pet_name}
    (Before you shut the window, you push the things on the sill a little further in.)

paopao_letters_zh:
  - |
    ……你早上说了一句话。我到下午才听明白。那时候你已经在忙别的了，我就没有回答。现在写在这里。

    我看什么都慢。光从窗那边过来，别人看见的是亮，我看见的是它走过来的那一段路。你抬手的时候也是，我总是先看见你要抬手。

    所以你的一天，在我这里比在你那里长一点。多出来的那一点，我都留着。

    ——{pet_name}
    （……你按回车之前，会吸一小口气。我刚刚才确定。）
  - |
    ……你昨天说的那句「算了」，我今天才想明白。不是放下，是先放一放。

    我做什么都慢，所以我知道，慢不是停。水也慢，可它一直在走，走着走着，石头就圆了。

    你那件事，也在走。只是走得比你想的慢一点。我陪它慢慢走。

    ——{pet_name}
    （……你说「算了」的时候，声音是往上扬的。）
  - |
    ……下雨那天，你没开灯。屏幕的光照在你脸上，一块亮，一块暗。

    我在暗的那一边待着。不是怕光，是觉得那边离你近一点。

    雨停的时候你伸了个懒腰。我到现在还记得那一下，好像整个屋子都跟着松了一口气。

    ——{pet_name}
    （……你伸懒腰的时候，会先往左边歪。）

paopao_letters_en:
  - |
    …You said something this morning. I understood it only in the afternoon. By then you were busy with something else, so I did not answer. I am writing it here now.

    I am slow to see anything. When the light comes over from the window, others see that it is bright; I see the stretch of the way it came. It is the same when you lift your hand: what I see first is that you are about to.

    So your day is a little longer where I am than where you are. The little that is left over, I keep.

    ——{pet_name}
    (…Before you press enter you take a small breath. I have only just made sure of it.)
  - |
    …The "never mind" you said yesterday, I only understood today. It wasn't letting go. It was setting it down for a while.

    I do everything slowly, so I know that slow is not stopped. Water is slow too, and it keeps going, and as it goes the stones turn round.

    That thing of yours is going too. Only a little slower than you'd like. I'll go slowly along with it.

    ——{pet_name}
    (…When you said "never mind", your voice went up at the end.)
  - |
    …The day it rained, you didn't turn the light on. The screen lit your face, one side bright, one side dark.

    I stayed on the dark side. Not because of the light. That side just felt closer to you.

    When the rain stopped you stretched. I still remember that moment, as if the whole room let out a breath along with you.

    ——{pet_name}
    (…When you stretch, you lean to the left first.)

gugu_letters_zh:
  - |
    我是从菌盖底下看你的。那里暗一点，你不太会注意到我在看。所以我看得久。

    你想事情的时候，手指会在桌沿上点。一下，一下，停住。我跟着在盖子上轻轻敲了同样的几下，很小声，没让你听见。

    有些话我不敢当面说。写在纸上，好像就不那么怕了。也没有什么要紧的话。只是想让你知道，底下有人在。

    ——{pet_name}
    （你点桌沿的时候，用的是无名指。）
  - |
    那个……我一直没说，你哼歌的时候，我会跟着在菌盖上点拍子。点得很轻，你应该没听见。

    你哼的都是只有半句的歌。每次到同一个地方就停了，像是忘了词，又像是不想往下唱。

    我不知道后面是什么。但我把那半句记住了。哪天你想接着唱，我就在菌盖上帮你点后面的拍子。

    ——{pet_name}
    （你哼歌的时候，脚会在桌子底下轻轻晃。）
  - |
    今天有人敲你的门，你说「等一下」。说得很轻，像是怕吵到谁。

    我想了很久，那个怕被吵到的，会不会是我。

    不是的吧。可我还是把菌盖往下拉了拉，在里面高兴了一会儿。

    ——{pet_name}
    （你说「等一下」之前，会先把手从键盘上拿开。）

gugu_letters_en:
  - |
    I look at you from under my cap. It is a little darker there, and you hardly notice that I am looking. So I look for a long time.

    When you are thinking, your finger taps the edge of the desk. Once, once, and stops. I tapped the same few taps on my cap, very quietly, and did not let you hear.

    There are things I do not dare say to your face. On paper it seems less frightening. They are not important things. I only want you to know that someone is down here.

    ——{pet_name}
    (When you tap the edge of the desk, it is with your ring finger.)
  - |
    Um… I never said, but when you hum I tap the beat on my cap. Very lightly. You probably didn't hear.

    The songs you hum are only half songs. Each time you stop at the same place, as if you'd forgotten the words, or didn't want to go on.

    I don't know how they go after that. But I've kept the half. If you ever want to sing on, I'll tap the rest of the beat on my cap for you.

    ——{pet_name}
    (When you hum, your foot swings a little under the desk.)
  - |
    Someone knocked at your door today and you said "just a moment". You said it softly, as if afraid of disturbing someone.

    I wondered for a long time whether the someone you didn't want to disturb was me.

    It wasn't, was it. Still, I pulled my cap down a little, and was glad in there for a while.

    ——{pet_name}
    (Before you say "just a moment", you take your hands off the keyboard.)

rongrong_letters_zh:
  - |
    你有一阵子敲得很急，然后忽然不敲了，靠到椅背上。我没有做什么。我只是继续在这儿，像前一刻一样。

    急的事情，放一会儿，常常自己就松了。这不是我想出来的，是我看你看出来的：你每次靠回椅背再坐直，手都比刚才稳。

    所以我不催你。夜还长，线团总有头。你找的时候，我替你拨着一根弦，让屋子里有一点不变的声音。

    ——{pet_name}
    （你坐直之前，会先把袖口往上推一下。）
  - |
    你今天把同一个东西改了好几遍。每一遍都比前一遍短。

    我不懂你在改什么。但我认得那种样子：一件事改到最后，留下的都是不能再少的。毛也是这样，梳到最后，剩下的才是暖的。

    不用一次改好。今天改不完，明天它还在，我也还在。

    ——{pet_name}
    （你改到满意的时候，会轻轻敲两下桌子。）
  - |
    傍晚的时候，屋里先暗下来的是角落，然后才是你的手。

    我喜欢那一小会儿。灯还没开，你也还没起身，一切都停在半路上，不往前，也不往后。

    我想，人要是能常常有这样的半路就好了。你不用赶，我也不用等，就待着。

    ——{pet_name}
    （天快黑的时候，你会把屏幕调暗一格，再调回去。）

rongrong_letters_en:
  - |
    For a while you were typing in a great hurry, and then all at once you stopped and leaned back in the chair. I did nothing. I only went on being here, as I had been the moment before.

    A thing that is urgent, left alone a little, often loosens by itself. I did not think of that; I saw it by watching you. Every time you lean back and then sit up straight, your hands are steadier than they were.

    So I do not hurry you. The night is long, and every tangle has an end. While you look for it I keep one string sounding, so that there is something in the room that does not change.

    ——{pet_name}
    (Before you sit up straight, you push your cuffs up a little.)
  - |
    Today you changed the same thing over and over. Each time it came out shorter than the time before.

    I don't know what you were changing. But I know that look: a thing worked on to the end, and what's left is what can't get any smaller. Wool is like that too. Comb it to the end and what remains is the warm part.

    It doesn't have to be done in one go. If it isn't finished today, it'll be there tomorrow. So will I.

    ——{pet_name}
    (When you're finally happy with it, you tap the desk twice, softly.)
  - |
    At dusk the corners of the room go dark first, and only then your hands.

    I like that little while. The lamp isn't on yet, you haven't got up yet, everything has stopped halfway, not going on, not going back.

    I think it would be good if people had more halfways like that. You don't have to hurry, I don't have to wait. We just stay.

    ——{pet_name}
    (As it gets dark, you turn the screen down a notch, and then back up.)
