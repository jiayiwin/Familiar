# 互动规则（设计稿 §7.6）。世界层每 500 ms 评估一次。
# 自己的规则放进 ~/.familiar/interactions/*.yaml；同 id 覆盖内置规则，enabled: false 可关掉。
#
# 字段：
#   on            触发：turn_done（对方 / 自己完成一轮）| state（进入某状态）
#   from          事件来自哪边：other（对方阵营，默认）| self
#   result        on: turn_done 时的结果：ok | error | aborted
#   min_turn_s    on: turn_done 时本轮至少多长
#   state         on: state 时进入的状态：attention | stone | error | done …
#   actor_state   做动作的宠物当前必须处于的状态之一
#   chance        概率 0–1
#   cooldown      同一只宠物同一条规则的冷却（s / m / h）
#   action        宠物播放的动作
#   working_action  做动作的宠物正在干活时改播这个（比如羡慕时 sulk）
#   bubble        随机一句气泡
#   bubble_en     英文气泡（同 bubble 的格式；没写时英文界面也用 bubble）
#   ms            持续时间
#   move          to_target：先走到对方身边，做完再走回来
#   during_attention  true：允许在有会话等你时触发（只有提醒类规则可以）
#
# 全局限制：每只宠物每小时最多 6 次主动互动；有会话等你时其余互动全部冻结。

rules:
  - id: taunt
    on: turn_done
    from: other
    result: error
    actor_state: [idle, done, sleeping]
    chance: 0.3
    cooldown: 10m
    action: taunt
    ms: 3000
    bubble:
      claude-code: ["翻车了吧～", "要不要我教你？", "嘿嘿，出错了"]
      codex: ["翻车了吧～", "要不要我教你？", "嘿嘿，出错了"]
    bubble_en:
      claude-code: ["Oops, crashed~", "Want me to show you how?", "Heh, error!"]
      codex: ["Oops, crashed~", "Want me to show you how?", "Heh, error!"]

  - id: comfort
    on: state
    from: other
    state: stone
    chance: 1
    cooldown: 10m
    action: comfort
    ms: 3500
    bubble:
      claude-code: ["别灰心，抱抱", "歇一下再来", "我陪你"]
      codex: ["别灰心，抱抱", "歇一下再来", "我陪你"]
    bubble_en:
      claude-code: ["Chin up, hug?", "Take a breather", "I'm right here"]
      codex: ["Chin up, hug?", "Take a breather", "I'm right here"]

  - id: applaud
    on: turn_done
    from: other
    result: ok
    min_turn_s: 300
    chance: 0.5
    cooldown: 10m
    action: cheer
    working_action: sulk
    ms: 2500
    bubble:
      claude-code: ["厉害！", "干得漂亮"]
      codex: ["厉害！", "干得漂亮"]
    bubble_en:
      claude-code: ["Nice one!", "Smooth work"]
      codex: ["Nice one!", "Smooth work"]

  - id: urge
    on: state
    from: other
    state: attention
    actor_state: [idle, done, sleeping]
    chance: 1
    cooldown: 2m
    action: wave
    move: to_target
    during_attention: true
    ms: 2500
    bubble:
      claude-code: ["它在等你！", "快去看看它"]
      codex: ["它在等你！", "快去看看它"]
    bubble_en:
      claude-code: ["It's waiting for you!", "Go check on it"]
      codex: ["It's waiting for you!", "Go check on it"]
