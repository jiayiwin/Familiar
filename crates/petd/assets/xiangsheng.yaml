# 相声段子：两只宠物空闲时（或右键 → 游戏 → 说相声、/pet xiangsheng）走到一起表演。
# 段子是原创的；《报菜名》贯口开头和《八百标兵》绕口令是传统民间段落。
#
# a 是逗哏（站在桌子旁边，抖包袱），b 是捧哏（站在桌子后面，接话）。
# 开场（"今天给大家说段《…》"）和结尾鞠躬由程序加，这里只写正文。
#
# 每句：[谁, 台词] 或 [谁, 台词, 标记]
#   谁    a | b | ab（两个一起说）
#   标记  laugh：说完观众笑；也可以写说话那只的动作：cheer sulk annoyed taunt wave dizzy thinking
#         多个用空格隔开，如 "laugh sulk"
#
# 自己的段子放进 ~/.familiar/xiangsheng/：*.yaml（格式同这个文件，同 id 覆盖内置段子），
# 或者纯文本 *.txt（第一行《标题》，后面 甲：… / 乙：…，括号里的舞台提示带“笑”就是笑声）。

zh:
  - id: bug-menu
    title: 报Bug名
    lines:
      - [a, "说相声讲究说学逗唱，今天我给您来段贯口。"]
      - [b, "贯口？那可是基本功。"]
      - [a, "您听好了：蒸羊羔、蒸熊掌、蒸鹿尾儿、烧花鸭、烧雏鸡、烧子鹅……"]
      - [b, "嗬！《报菜名》！", cheer]
      - [a, "哎不对，背串了。我现在是桌宠，得报Bug名。"]
      - [b, "Bug还有名儿？"]
      - [a, "您听着：空指针、野指针、数组越界、内存泄漏、死循环、死锁、栈溢出……"]
      - [a, "时区差一天、浮点算不准、缓存不刷新、改一行崩一片……"]
      - [b, "停停停！我听着都头疼。", dizzy]
      - [a, "还有最后一道硬菜，专治各种不服。"]
      - [b, "什么菜？"]
      - [a, "“我这儿是好的”！", laugh]
      - [b, "这也算Bug？"]
      - [a, "这道最难治：测试一点就复现，开发一看就消失。"]
      - [b, "那怎么修呢？"]
      - [a, "修不了，只能截个图发到群里，配一句：“谁动我代码了？”", laugh]
      - [b, "去你的吧！", annoyed]

  - id: ai
    title: 我是AI
    lines:
      - [a, "跟您说，我现在干的是高科技。"]
      - [b, "你一个桌宠，什么高科技？"]
      - [a, "人工智能。我搭档写代码，我盯着。"]
      - [b, "盯着算什么活儿？"]
      - [a, "最要紧的活儿。"]
      - [b, "怎么个要紧？"]
      - [a, "它干活儿，我看着；它报错，我叹气；它干完了，我领金币。", laugh]
      - [b, "合着你就是个监工啊。"]
      - [a, "什么监工，这叫“人机协作”。"]
      - [b, "那你自己会写代码吗？"]
      - [a, "会啊！昨天我还写了一行。"]
      - [b, "写的什么？"]
      - [a, "“// TODO: 明天再说”。", laugh]
      - [b, "这还用你写？"]
      - [a, "那可不，这行代码全世界的程序员天天写，从来没人删过。", laugh]
      - [b, "你倒挺骄傲！", annoyed]

  - id: waiting
    title: 等确认
    lines:
      - [a, "最近我可太累了。"]
      - [b, "你一个桌宠累什么？"]
      - [a, "我搭档一干活儿就问：“这个文件能改吗？”"]
      - [b, "那得问问主人。"]
      - [a, "问了。主人呢？倒水去了。"]
      - [b, "嗯。"]
      - [a, "回来坐下，它又问：“这条命令能跑吗？”"]
      - [b, "那就点个同意呗。"]
      - [a, "主人又开会去了。"]
      - [b, "嘿。"]
      - [a, "等主人开完会回来一看——"]
      - [b, "干完了？"]
      - [a, "还在那儿等着呢，等了二十分钟！", laugh]
      - [b, "那怎么办呢？"]
      - [a, "所以才有了我啊！主人一走开，我就蹦起来喊：“快回来，有人等你！”", cheer]
      - [b, "主人回来了吗？"]
      - [a, "回来了，把我拖到角落，开了个专注模式。", "laugh sulk"]
      - [b, "该！", taunt]

  - id: naming
    title: 起名字
    lines:
      - [a, "您知道程序员最难的事是什么吗？"]
      - [b, "修Bug？"]
      - [a, "不对。"]
      - [b, "加班？"]
      - [a, "也不对。是起名字。"]
      - [b, "起名字有什么难的？"]
      - [a, "那您来，给这个变量起个名儿。"]
      - [b, "就叫“数据”。"]
      - [a, "下一个呢？"]
      - [b, "“数据二”。"]
      - [a, "再来一个？"]
      - [b, "“新数据”、“最新数据”、“最终数据”、“最终数据真的最终版”……", thinking]
      - [a, "得，您这代码三个月以后，自己都看不懂。", laugh]
      - [b, "那你说叫什么？"]
      - [a, "我们家讲究，变量名必须说清楚用途。"]
      - [b, "那叫什么？"]
      - [a, "“这个别动”。", laugh]
      - [b, "这是名字？"]
      - [a, "下一个叫“这个也别动”，最后一个叫“动了就是你改的”。", laugh]
      - [b, "你这是起名还是甩锅！", annoyed]

  - id: tongue-twister
    title: 绕口令
    lines:
      - [a, "我给您说段绕口令。"]
      - [b, "好啊，来一个。"]
      - [a, "八百标兵奔北坡，炮兵并排北边跑。"]
      - [b, "嗬，挺溜！"]
      - [a, "炮兵怕把标兵碰，标兵怕碰炮兵炮。"]
      - [b, "好！再来个新的。", cheer]
      - [a, "新的是我自己编的，您跟我学：改Bug改出Bug，补Bug补出补Bug的Bug，不补Bug的Bug补不补？"]
      - [b, "改Bug改出……补Bug补出……补不补……", dizzy]
      - [a, "您看，念都念不顺，怎么改得顺。", laugh]
      - [b, "这叫绕口令吗？"]
      - [a, "这叫日常。再来个短的：需求不改不上线，上线之后改需求。"]
      - [b, "需求不改不上线，上线之后改需求——这个我会，不用学！"]
      - [a, "您也干过？"]
      - [b, "我天天这么过！", "laugh sulk"]

  - id: new-year
    title: 过年
    lines:
      - [a, "马上要过年了。"]
      - [b, "是啊，回家团圆。"]
      - [a, "我最怕过年回家。"]
      - [b, "怕什么？"]
      - [a, "亲戚问：“在哪儿上班啊？”"]
      - [b, "那你怎么说？"]
      - [a, "我说：“在屏幕右下角。”", laugh]
      - [b, "这叫什么单位？"]
      - [a, "又问：“一个月挣多少？”"]
      - [b, "你挣多少？"]
      - [a, "看我搭档。它干活儿多，我钓鱼多，一天几十个金币。"]
      - [b, "金币能买什么？"]
      - [a, "能买帽子，能买鱼竿，还能买一张重置卡——给搭档回血用的。"]
      - [b, "合着你挣钱给它花。"]
      - [a, "它干活，我花钱，这叫家庭分工。", laugh]
      - [b, "就这些啊？"]
      - [a, "亲戚一听，说：“那你还不如回老家考个公务员。”"]
      - [b, "那你考吗？"]
      - [a, "我倒是想考，可我离不开任务栏啊。", laugh]
      - [b, "合着你就是个桌宠！", taunt]

  - id: health
    title: 锻炼
    lines:
      - [a, "我主人，身体特别好。"]
      - [b, "程序员？身体好？"]
      - [a, "那当然，天天锻炼。"]
      - [b, "练什么？"]
      - [a, "练颈椎。低头看手机，抬头看屏幕，一天两千次。", laugh]
      - [b, "这叫锻炼？"]
      - [a, "还练腰。椅子往后一仰，往前一趴，再一仰——"]
      - [b, "那是困了！"]
      - [a, "还练手腕。鼠标一天滑八公里。", laugh]
      - [b, "合着全是坐着练的。"]
      - [a, "坐着也能练正经的。我教他一个：收紧、保持、放松。"]
      - [b, "练哪儿？"]
      - [a, "您别问。坐着就行，谁也看不出来。", laugh]
      - [b, "这么隐蔽？"]
      - [a, "隐蔽是隐蔽，就是有一回开会，练得太投入了。"]
      - [b, "怎么了？"]
      - [a, "领导问他：“这个方案你有什么意见？”他说：“我再坚持三秒！”", laugh]
      - [b, "去你的吧！", annoyed]

  - id: boss-key
    title: 老板键
    lines:
      - [a, "我有个绝活儿。"]
      - [b, "什么绝活儿？"]
      - [a, "隐身术！"]
      - [b, "你还会隐身？"]
      - [a, "主人一按 Ctrl+Alt+H，我“唰”一下就没了。"]
      - [b, "嗬，这么快？"]
      - [a, "专门对付老板的，这叫“老板键”。"]
      - [b, "老板来了你就消失？"]
      - [a, "对！我消失，主人的游戏也消失，屏幕上就剩一张表格。", laugh]
      - [b, "好家伙，配合得挺默契。"]
      - [a, "那天老板走过来，主人一按，我们全没了。"]
      - [b, "老板说什么？"]
      - [a, "老板说：“小王，你屏幕右下角那只猫呢？我刚才还跟它打招呼呢。”", laugh]
      - [b, "老板怎么还认识你？"]
      - [a, "老板自己电脑上也养了一只！", laugh]
      - [b, "合着全公司都在摸鱼啊！", taunt]

en:
  - id: waiting
    title: Waiting for Approval
    lines:
      - [a, "Busy day. My partner's an AI coding agent."]
      - [b, "What does it do all day?"]
      - [a, "It asks questions. \"Can I edit this file?\""]
      - [b, "Fair enough."]
      - [a, "\"Can I run this command?\" \"Can I delete node_modules?\""]
      - [b, "And the human says yes?"]
      - [a, "The human is getting coffee."]
      - [b, "For how long?"]
      - [a, "Twenty minutes. The coffee machine is in another city.", laugh]
      - [b, "So what do you do?"]
      - [a, "I jump up and down yelling \"COME BACK, SOMEONE NEEDS YOU!\"", cheer]
      - [b, "Does it work?"]
      - [a, "Oh yes. Now I live in focus mode.", "laugh sulk"]

  - id: naming
    title: Naming Things
    lines:
      - [a, "What's the hardest problem in programming?"]
      - [b, "Cache invalidation?"]
      - [a, "Naming things."]
      - [b, "Easy. Call it \"data\"."]
      - [a, "And the next one?"]
      - [b, "\"data2\"."]
      - [a, "Next?"]
      - [b, "\"newData\", \"finalData\", \"finalData_REAL_v3\"…", thinking]
      - [a, "Beautiful. In three months nobody will know what anything is.", laugh]
      - [b, "So what do you name things?"]
      - [a, "Every variable is called Kevin."]
      - [b, "Why Kevin?"]
      - [a, "When it breaks, we know who to blame.", laugh]
      - [b, "Poor Kevin!", annoyed]

  - id: bug-menu
    title: Tonight's Specials
    lines:
      - [a, "Welcome! Tonight's specials, fresh from our kitchen of bugs."]
      - [b, "Oh no."]
      - [a, "A null pointer, lightly dereferenced. An off-by-one, served one day late."]
      - [b, "Mm-hm."]
      - [a, "A memory leak that never ends, and a race condition — whoever gets there first."]
      - [b, "Anything for dessert?"]
      - [a, "Our signature dish: \"Works on my machine.\""]
      - [b, "How is it served?"]
      - [a, "It isn't. It only exists in the chef's kitchen.", laugh]
      - [b, "I'll just have water."]
      - [a, "Sorry, the water has a timezone bug. That's tomorrow's water.", laugh]
      - [b, "Check, please!", annoyed]

  - id: boss-key
    title: The Boss Key
    lines:
      - [a, "I can turn invisible."]
      - [b, "Since when?"]
      - [a, "Ctrl+Alt+H. Poof. Gone."]
      - [b, "Why would a desktop pet need that?"]
      - [a, "The boss walks by, I vanish, and the screen shows a spreadsheet.", laugh]
      - [b, "Clever."]
      - [a, "Yesterday the boss stopped and said, \"Where's the little cat? I wanted to say hi.\""]
      - [b, "The boss knows you?"]
      - [a, "The boss has two of us.", laugh]
      - [b, "So the whole office is goofing off!", taunt]

  - id: health
    title: Training
    lines:
      - [a, "My human is in great shape."]
      - [b, "A programmer? In shape?"]
      - [a, "Trains every day."]
      - [b, "Trains what?"]
      - [a, "Neck. Phone down, screen up. Two thousand reps a day.", laugh]
      - [b, "That's not training."]
      - [a, "Lower back too. Lean back, slump forward, lean back—"]
      - [b, "That's falling asleep!"]
      - [a, "And wrists. The mouse does five miles a day.", laugh]
      - [b, "So it's all sitting down."]
      - [a, "You can do real exercise sitting down. I taught him one: squeeze, hold, release."]
      - [b, "Squeeze what?"]
      - [a, "Don't ask. Nobody can tell.", laugh]
      - [b, "Very discreet."]
      - [a, "Very. Until one meeting he got a bit too into it."]
      - [b, "And?"]
      - [a, "Boss says, \"Any thoughts on the plan?\" He says, \"Three more seconds!\"", laugh]
      - [b, "Get out of here!", annoyed]
